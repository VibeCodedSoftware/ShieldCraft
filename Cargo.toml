[workspace]
members = ["crates/shieldcraft-core", "crates/shieldcraft-studio"]
default-members = ["crates/shieldcraft-studio", "crates/shieldcraft-core"]
resolver = "3"

[workspace.package]
repository = "https://github.com/DFairGamz/ShieldCraft"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
authors = ["ShieldCraft contributors"]
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
shieldcraft-core = { path = "crates/shieldcraft-core" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif", "ico"] }
png = "0.18"
img-parts = "=0.4.0"
rayon = "1.11"
crossbeam-channel = "0.5.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
directories = "6"
log = "0.4"
sha2 = "0.10"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
ab_glyph = "0.2"
blind_watermark = "=0.1.3"
# ONNX Runtime bindings; onnxruntime.dll (official Microsoft build) is loaded at runtime by the
# isolated worker only, so the main app never links it.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"] }
ureq = "=3.4.2"
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui = "=0.33.3"
egui-phosphor = "=0.11.0"
rfd = "=0.15.4"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
